# single node install config (дефолт образа trinodb/trino:476)
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
# Лимит памяти запроса. Дефолт = 30% кучи (~1.8 ГБ при VM Docker 8 ГБ) — мало для
# джойна orders(15 млн) x lineitem(60 млн) на sf10. Куча ~6.1 ГБ, headroom ~1.8 ГБ -> 3.5 ГБ безопасно.
query.max-memory-per-node=3.5GB
query.max-memory=3.5GB
